name: Android Release Validation
on:
  push:
    branches: ['codex/android-release-acceptance']
permissions:
  contents: read
  actions: read
concurrency:
  group: android-release-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler-cache: true
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
      - name: Locked contracts without signing or Play credentials
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run ci:test
  native-admission:
    needs: contracts
    if: ${{ github.repository == 'quinn521/aegis-browser' && vars.AEGIS_ANDROID_NATIVE_ADMISSION_ENABLED == 'true' && github.sha == vars.AEGIS_ANDROID_REHEARSAL_SOURCE_SHA }}
    runs-on: [self-hosted, Linux, ARM64, aegis-android-admission]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AEGIS_ANDROID_EXPERIMENTAL_ARM64: 'true'
      AEGIS_ANDROID_NATIVE_SOURCE: ${{ vars.AEGIS_ANDROID_NATIVE_SOURCE }}
      AEGIS_ANDROID_GN_BINARY: ${{ vars.AEGIS_ANDROID_GN_BINARY }}
      QEMU_RESERVED_VA: '1099511627776'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current Android operator before unsigned native admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/android-operator.mjs
      - name: Verify actual locked compiler and host ABI without packaging
        run: |
          test -n "$AEGIS_ANDROID_NATIVE_SOURCE"
          test -n "$AEGIS_ANDROID_GN_BINARY"
          python3 -B scripts/release/android-native-admission.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-native-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/android-native-admission/result.json
          if-no-files-found: error
