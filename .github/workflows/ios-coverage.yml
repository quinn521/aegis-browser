name: iOS Coverage
on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [develop, main]
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}-{1}', github.ref, github.sha) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  impact:
    name: ios-coverage-impact
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select iOS coverage from the tested Git diff
        id: route
        env:
          EVENT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/coverage-impact.sh ios
  ios-coverage:
    name: ios-coverage
    needs: impact
    if: ${{ needs.impact.outputs.run == 'true' && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_REPORT_DIR: /tmp/aegis-ios-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Require repository Admin for manual operation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci/ios-operator.mjs --context coverage
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Go for the locked EmbeddedCore build
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned XcodeGen
        timeout-minutes: 5
        shell: bash
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --noproxy "${no_proxy:-},${NO_PROXY:-},github.com,.github.com,githubusercontent.com,.githubusercontent.com" \
            --output "$archive" https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip
          printf '%s  %s\n' 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892 "$archive" | shasum -a 256 --check
          ditto -x -k "$archive" "$RUNNER_TEMP/aegis-xcodegen"
          bin="$RUNNER_TEMP/aegis-xcodegen/xcodegen/bin"
          "$bin/xcodegen" --version
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: Run iPhone and iPad tests with Swift coverage
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: bash apps/ios/scripts/run-simulator-tests.sh --execute --output-dir "$IOS_REPORT_DIR"
      - name: Upload Swift coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_REPORT_DIR }}/*.xcresult
            ${{ env.IOS_REPORT_DIR }}/*-xcodebuild.log
            ${{ env.IOS_REPORT_DIR }}/*-summary.json
            ${{ env.IOS_REPORT_DIR }}/*-coverage.json
            ${{ env.IOS_REPORT_DIR }}/*-coverage.txt
            ${{ env.IOS_REPORT_DIR }}/ios-input-sha256-*.txt
            ${{ env.IOS_REPORT_DIR }}/run-metadata.txt
            ${{ env.IOS_REPORT_DIR }}/simulator-runtime.json
            ${{ env.IOS_REPORT_DIR }}/fixture.log
            ${{ env.IOS_REPORT_DIR }}/build.log
          if-no-files-found: error
          retention-days: 14
