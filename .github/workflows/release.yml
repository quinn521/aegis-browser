# All entrypoints call the same local Fastlane stages. Store review is explicit.
name: Aegis Release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Package platform
        required: true
        type: choice
        options:
          - ios
          - android
          - macos
      profile:
        description: Build profile, independent of destination
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - release
      destination:
        description: Destination; package never uploads
        type: choice
        default: artifacts
        options:
          - artifacts
          - testflight
          - testflight-internal
          - testflight-external
          - asc
          - app-store
          - play-internal
          - play-closed
          - play-open
          - play-production
          - github-draft
      operation:
        description: Last stage to execute; submit is an explicit review request
        type: choice
        default: package
        options:
          - package
          - upload
          - distribute
          - submit
      version:
        description: iOS version override; native must match source
        type: string
      build:
        description: iOS build override; Android must match source
        type: string
      format:
        description: auto = IPA, AAB, DMG; APK is sideload only
        type: choice
        default: auto
        options:
          - auto
          - apk
          - aab
      tag:
        description: Existing candidate/<platform>/... tag for GitHub Draft
        type: string
      store_options:
        description: "JSON string fields: groups, track, play_release_policy; no credentials"
        type: string
        default: "{}"
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      profile:
        type: string
        required: false
        default: alpha
      destination:
        type: string
        required: false
        default: artifacts
      operation:
        type: string
        required: false
        default: package
      version:
        type: string
        required: false
      build:
        type: string
        required: false
      format:
        type: string
        required: false
        default: auto
      tag:
        type: string
        required: false
      store_options:
        type: string
        required: false
        default: "{}"
permissions:
  contents: read
concurrency:
  group: aegis-release-${{ github.repository }}
  cancel-in-progress: false
env:
  RELEASE_PLATFORM: ${{ inputs.platform }}
  RELEASE_DESTINATION: ${{ inputs.destination }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
  AEGIS_RELEASE_ENABLED: ${{ vars.AEGIS_RELEASE_ENABLED }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_GITHUB_ISSUES: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  BUNDLE_FROZEN: "true"
  BUNDLE_PATH: vendor/bundle
  RELEASE_PROFILE: ${{ inputs.profile }}
  RELEASE_OPERATION: ${{ inputs.operation }}
  RELEASE_FORMAT: ${{ inputs.format }}
  RELEASE_STORE_OPTIONS: ${{ inputs.store_options }}
  AEGIS_RELEASE_REHEARSAL: ${{ vars.AEGIS_RELEASE_REHEARSAL }}
  AEGIS_RELEASE_TEST_REPOSITORY_ID: ${{ vars.AEGIS_RELEASE_TEST_REPOSITORY_ID }}
  AEGIS_IOS_LOCAL_REHEARSAL: ${{ vars.AEGIS_IOS_LOCAL_REHEARSAL }}
jobs:
  preflight:
    if: ${{ vars.AEGIS_RELEASE_ENABLED == 'true' && ((github.repository == 'gcsagroup/aegis-browser' && github.repository_id
      == '1348409663' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/candidate/'))) ||
      (github.repository != 'gcsagroup/aegis-browser' && vars.AEGIS_RELEASE_REHEARSAL == 'true' && github.repository_id
      == vars.AEGIS_RELEASE_TEST_REPOSITORY_ID)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler: 2.5.22
      - name: Verify exact upstream source and latest quality attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Validate destination and choose a fixed runner
        id: route
        env:
          CHROMIUM_RUNNERS_READY: ${{ vars.AEGIS_CHROMIUM_RELEASE_RUNNERS_READY }}
          MACOS_RUNNERS_READY: ${{ vars.AEGIS_MACOS_RELEASE_RUNNERS_READY }}
          ANDROID_RUNNERS_READY: ${{ vars.AEGIS_ANDROID_RELEASE_RUNNERS_READY }}
        run: |
          bash scripts/release/action.sh plan
          ruby scripts/release/runner.rb >> "$GITHUB_OUTPUT"
  package:
    needs: preflight
    runs-on: ${{ fromJSON(needs.preflight.outputs.runner) }}
    environment: aegis-release-${{ inputs.platform }}
    timeout-minutes: 1440
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      run_id: ${{ steps.package.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ inputs.platform == 'android' || runner.environment == 'github-hosted' }}
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        if: ${{ inputs.platform == 'android' || runner.environment == 'github-hosted' }}
        with:
          ruby-version: 3.3.6
          bundler: 2.5.22
      - name: Verify preinstalled inputs for a fork local iOS rehearsal
        if: ${{ inputs.platform == 'ios' && runner.environment == 'self-hosted' }}
        env:
          AEGIS_LOCAL_IOS_BUNDLE_PATH: ${{ vars.AEGIS_LOCAL_IOS_BUNDLE_PATH }}
        run: ruby scripts/release/local-ios-rehearsal.rb
      - name: Verify preinstalled macOS runtime and private native caches
        if: ${{ inputs.platform == 'macos' && runner.environment == 'self-hosted' }}
        env:
          MACOS_RUNNERS_READY: ${{ vars.AEGIS_MACOS_RELEASE_RUNNERS_READY }}
          CHROMIUM_RUNNERS_READY: ${{ vars.AEGIS_CHROMIUM_RELEASE_RUNNERS_READY }}
          AEGIS_LOCAL_MACOS_BUNDLE_PATH: ${{ vars.AEGIS_LOCAL_MACOS_BUNDLE_PATH }}
          CHROMIUM_ROOT: ${{ vars.AEGIS_CHROMIUM_ROOT }}
          DEPOT_TOOLS_DIR: ${{ vars.AEGIS_DEPOT_TOOLS_DIR }}
          CIPD_CACHE_DIR: ${{ vars.AEGIS_CIPD_CACHE_DIR }}
          VPYTHON_VIRTUALENV_ROOT: ${{ vars.AEGIS_VPYTHON_VIRTUALENV_ROOT }}
          TMPDIR: ${{ vars.AEGIS_NATIVE_TMPDIR }}
        run: ruby scripts/release/local-macos-release.rb
      - name: Install locked Fastlane dependencies
        run: bundle install --jobs 4 --retry 2
      - name: Exercise real macOS image verification and failure cleanup
        if: ${{ inputs.platform == 'macos' }}
        env:
          AEGIS_NATIVE_SIGNING_REGRESSION: "true"
        run: python3 -B -m unittest discover -s scripts/release -p 'test_verify_macos*.py' -v
      - name: Read existing iOS signing material
        if: ${{ inputs.platform == 'ios' && runner.environment == 'github-hosted' }}
        env:
          AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
          AEGIS_MATCH_GIT_URL: ${{ vars.AEGIS_MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios ci_signing
      - name: Build and verify package using the local release entrypoint
        id: package
        env:
          AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
          AEGIS_IOS_PROFILES: ${{ vars.AEGIS_IOS_PROFILES }}
          DEVELOPER_DIR: ${{ vars.AEGIS_DEVELOPER_DIR }}
          CHROMIUM_ROOT: ${{ vars.AEGIS_CHROMIUM_ROOT }}
          DEPOT_TOOLS_DIR: ${{ vars.AEGIS_DEPOT_TOOLS_DIR }}
          AEGIS_AAPT2: ${{ vars.AEGIS_AAPT2 }}
          AEGIS_APKSIGNER: ${{ vars.AEGIS_APKSIGNER }}
          AEGIS_BUNDLETOOL_JAR: ${{ vars.AEGIS_BUNDLETOOL_JAR }}
          AEGIS_ANDROID_KEYSTORE: ${{ vars.AEGIS_ANDROID_KEYSTORE }}
          AEGIS_ANDROID_KEY_ALIAS: ${{ vars.AEGIS_ANDROID_KEY_ALIAS }}
          AEGIS_ANDROID_CERT_SHA256: ${{ vars.AEGIS_ANDROID_CERT_SHA256 }}
          AEGIS_ANDROID_STORE_PASSWORD: ${{ inputs.platform == 'android' && secrets.AEGIS_ANDROID_STORE_PASSWORD || '' }}
          AEGIS_ANDROID_KEY_PASSWORD: ${{ inputs.platform == 'android' && secrets.AEGIS_ANDROID_KEY_PASSWORD || '' }}
        run: bash scripts/release/action.sh package
      - name: Save installable packages and identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: |
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.ipa
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.apk
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.aab
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.dmg
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.dSYM.zip
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.build-identity.json
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*-manifest.json
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.sha256
          if-no-files-found: error
          retention-days: 14
  testflight:
    needs:
      - preflight
      - package
    if: ${{ inputs.platform == 'ios' && inputs.destination != 'artifacts' && inputs.destination != 'github-draft' &&
      inputs.operation != 'package' }}
    runs-on: macos-26
    environment: aegis-testflight
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler: 2.5.22
      - run: bundle install --jobs 4 --retry 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - name: Upload the verified IPA without distributing or submitting
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bash scripts/release/action.sh upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: store-upload-record-ios-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/ios/${{ env.RELEASE_RUN_ID }}/apple-upload-*.json
          if-no-files-found: warn
    env:
      RELEASE_RUN_ID: ${{ needs.package.outputs.run_id }}
  github-draft:
    needs:
      - preflight
      - package
    if: ${{ inputs.destination == 'github-draft' && inputs.operation == 'upload' }}
    runs-on: ubuntu-24.04
    environment: aegis-github-draft
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler: 2.5.22
      - run: bundle install --jobs 4 --retry 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - name: Upload candidate assets and verify remote digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: bash scripts/release/action.sh upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: github-draft-receipt-${{ env.RELEASE_RUN_ID }}
          path: |
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/github-upload-*.json
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/github-draft-create-*.json
          if-no-files-found: warn
    env:
      RELEASE_RUN_ID: ${{ needs.package.outputs.run_id }}
  play:
    needs:
      - preflight
      - package
    if: ${{ inputs.platform == 'android' && startsWith(inputs.destination, 'play-') && inputs.operation != 'package' }}
    runs-on: ubuntu-24.04
    environment: aegis-play
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler: 2.5.22
      - run: bundle install --jobs 4 --retry 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - name: Upload the signed AAB as a Play draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
          AEGIS_PLAY_JSON_KEY_DATA: ${{ secrets.AEGIS_PLAY_JSON_KEY_DATA }}
        run: ruby scripts/release/with-play-key.rb upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: store-upload-record-android-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/android/${{ env.RELEASE_RUN_ID }}/play-upload-*.json
          if-no-files-found: warn
    env:
      RELEASE_RUN_ID: ${{ needs.package.outputs.run_id }}
  store-finish:
    needs:
      - preflight
      - package
      - testflight
      - play
    if: ${{ always() && needs.preflight.result == 'success' && needs.package.result == 'success' && (inputs.operation ==
      'distribute' || inputs.operation == 'submit') && (needs.testflight.result == 'success' || needs.play.result ==
      'success') }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    environment: aegis-${{ inputs.platform }}-${{ inputs.operation }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: 3.3.6
          bundler: 2.5.22
      - run: bundle install --jobs 4 --retry 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: store-upload-record-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - name: Execute the explicitly selected distribution or review stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
          AEGIS_PLAY_JSON_KEY_DATA: ${{ secrets.AEGIS_PLAY_JSON_KEY_DATA }}
        run: |
          if [[ "$RELEASE_PLATFORM" == android ]]; then
            ruby scripts/release/with-play-key.rb finish
          else
            bash scripts/release/action.sh finish
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: store-stage-record-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/${{ inputs.platform }}-${{ inputs.operation
            }}-*.json
          if-no-files-found: warn
    env:
      RELEASE_RUN_ID: ${{ needs.package.outputs.run_id }}
