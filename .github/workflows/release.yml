name: Aegis Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Package platform
        required: true
        type: choice
        options: [ios, android, macos]
      destination:
        description: Package only, TestFlight (iOS), or GitHub candidate draft
        required: true
        default: artifacts
        type: choice
        options: [artifacts, testflight, github-draft]
      version:
        description: Optional iOS version; Chromium uses the committed product version
        type: string
      build:
        description: Optional iOS build; Android uses the committed versionCode
        type: string
      tag:
        description: Existing candidate/<platform>/... tag at this main SHA (GitHub Draft only)
        type: string

permissions:
  contents: read

# Serializing releases also protects the dedicated Chromium output and signing state.
concurrency:
  group: aegis-release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_PLATFORM: ${{ inputs.platform }}
  RELEASE_DESTINATION: ${{ inputs.destination }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
  AEGIS_RELEASE_ENABLED: ${{ vars.AEGIS_RELEASE_ENABLED }}
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_GITHUB_ISSUES: '1'
  FASTLANE_OPT_OUT_USAGE: '1'
  BUNDLE_FROZEN: 'true'
  BUNDLE_PATH: vendor/bundle

jobs:
  preflight:
    if: >-
      ${{ github.repository == 'gcsagroup/aegis-browser' &&
          github.repository_id == '1348409663' && github.ref == 'refs/heads/main' &&
          vars.AEGIS_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
      - name: Verify exact upstream source and latest quality attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-preflight.mjs --sha "$GITHUB_SHA"
      - name: Validate destination and choose a fixed runner
        id: route
        env:
          CHROMIUM_RUNNERS_READY: ${{ vars.AEGIS_CHROMIUM_RELEASE_RUNNERS_READY }}
        run: |
          bash scripts/release/action.sh plan
          case "$RELEASE_PLATFORM" in
            ios) echo 'runner="macos-26"' >> "$GITHUB_OUTPUT" ;;
            macos)
              test "$CHROMIUM_RUNNERS_READY" = true
              echo 'runner=["self-hosted","macOS","ARM64","aegis-release"]' >> "$GITHUB_OUTPUT"
              ;;
            android)
              test "$CHROMIUM_RUNNERS_READY" = true
              echo 'runner=["self-hosted","Linux","X64","aegis-release"]' >> "$GITHUB_OUTPUT"
              ;;
            *) exit 2 ;;
          esac

  package:
    needs: preflight
    runs-on: ${{ fromJSON(needs.preflight.outputs.runner) }}
    environment: aegis-release-${{ inputs.platform }}
    timeout-minutes: 1440
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
      - name: Install locked Fastlane dependencies
        run: bundle install --jobs 4 --retry 2
      - name: Read existing iOS signing material
        if: ${{ inputs.platform == 'ios' }}
        env:
          AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
          AEGIS_MATCH_GIT_URL: ${{ vars.AEGIS_MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios ci_signing
      - name: Build and verify package using the local release entrypoint
        id: package
        env:
          AEGIS_APPLE_TEAM_ID: ${{ vars.AEGIS_APPLE_TEAM_ID }}
          AEGIS_IOS_PROFILES: ${{ vars.AEGIS_IOS_PROFILES }}
          DEVELOPER_DIR: ${{ vars.AEGIS_DEVELOPER_DIR }}
          CHROMIUM_ROOT: ${{ vars.AEGIS_CHROMIUM_ROOT }}
          DEPOT_TOOLS_DIR: ${{ vars.AEGIS_DEPOT_TOOLS_DIR }}
          AEGIS_AAPT2: ${{ vars.AEGIS_AAPT2 }}
          AEGIS_APKSIGNER: ${{ vars.AEGIS_APKSIGNER }}
        run: bash scripts/release/action.sh package
      - name: Save installable packages and identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: |
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.ipa
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.apk
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.dmg
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.dSYM.zip
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.build-identity.json
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*-manifest.json
            .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/*.sha256
          if-no-files-found: error
          retention-days: 14

  testflight:
    needs: [preflight, package]
    if: ${{ inputs.platform == 'ios' && inputs.destination == 'testflight' }}
    runs-on: macos-26
    environment: aegis-testflight
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
      - run: bundle install --jobs 4 --retry 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - name: Upload the verified IPA without distributing to external testers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
          AEGIS_ASC_KEY_ID: ${{ secrets.AEGIS_ASC_KEY_ID }}
          AEGIS_ASC_ISSUER_ID: ${{ secrets.AEGIS_ASC_ISSUER_ID }}
          AEGIS_ASC_KEY_BASE64: ${{ secrets.AEGIS_ASC_KEY_BASE64 }}
        run: bash scripts/release/action.sh upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: testflight-receipt-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/ios/${{ env.RELEASE_RUN_ID }}/testflight-*.json
          if-no-files-found: warn

  github-draft:
    needs: [preflight, package]
    if: ${{ inputs.destination == 'github-draft' }}
    runs-on: ubuntu-24.04
    environment: aegis-github-draft
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
      - run: bundle install --jobs 4 --retry 2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ inputs.platform }}-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}
      - name: Upload candidate assets and verify remote digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: bash scripts/release/action.sh upload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-draft-receipt-${{ env.RELEASE_RUN_ID }}
          path: .artifacts/release/${{ inputs.platform }}/${{ env.RELEASE_RUN_ID }}/github-upload-*.json
          if-no-files-found: error
