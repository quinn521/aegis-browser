name: Access T3 API boundary at ab7a5630
on:
  push:
    branches: [feat/access-t3-run-ab7a5630]
permissions:
  contents: read
env:
  TESTED_SHA: ab7a56307a79040d571bb4173846893aac9343e6
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 25]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ab7a56307a79040d571bb4173846893aac9343e6
          persist-credentials: false
      - name: Build the unchanged x86_64 API 26 target
        working-directory: apps/browser/access-cmake
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
          ndk="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ndk"
          cat "$ndk/source.properties"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          cmake --version
          ninja --version
          python3 --version
          cmake --preset android-x64 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build out/android-x64 --parallel 4
          file out/android-x64/aegis_access_native_test
          sha256sum out/android-x64/aegis_access_native_test
          grep -o -- '--target=[^ ]*android[0-9]*' out/android-x64/compile_commands.json | sort -u
      - name: Enable KVM for the job emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe actual minimum-API behavior
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none
          script: |
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abilist
            ctest --test-dir apps/browser/access-cmake/out/android-x64 -V --no-tests=error
