name: Release Branch Validation

# No signing or upload credentials. This can run before the release workflow is
# merged onto the default branch and therefore before workflow_dispatch exists.
on:
  push:
    branches: ['codex/fastlane-release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked Fastlane and CI test dependencies
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: vendor/bundle
        run: |
          bundle install --jobs 4 --retry 2
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run release regressions and load real Fastlane lanes
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: vendor/bundle
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_GITHUB_ISSUES: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          bundle exec ruby fastlane/tests/tag_test.rb
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -B apps/browser/scripts/verify-build-source_test.py
          node apps/browser/scripts/write-build-identity.mjs --self-test
          node apps/browser/scripts/gestures-settings_test.mjs
          bash apps/browser/scripts/package-android-guards_test.sh
          pnpm run ci:test
          bundle exec fastlane lanes
          ./release ios plan --version 0.8.0 --build 1

  ios-archive:
    needs: contracts
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile iOS 0.8.0 (1) without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release-validation
          xcodebuild -project apps/ios/Aegis.xcodeproj \
            -scheme Aegis-Release -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Aegis-unsigned.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/Aegis-DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=0.8.0 CURRENT_PROJECT_VERSION=1 archive \
            > .artifacts/release-validation/archive.log 2>&1
          python3 scripts/release/verify-ios-archive.py \
            "$RUNNER_TEMP/Aegis-unsigned.xcarchive" 0.8.0 1 \
            > .artifacts/release-validation/archive-verification.json
      - name: Save compilation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-080-1-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-validation/*
          if-no-files-found: warn
          retention-days: 14

  # Opt-in fork rehearsal uses the same protected packaging workflow. The two
  # uncredentialed prerequisite jobs above must finish before credentials load.
  release-rehearsal:
    needs: [contracts, ios-archive]
    if: >-
      ${{ github.repository != 'gcsagroup/aegis-browser' &&
          vars.AEGIS_RELEASE_ENABLED == 'true' && vars.AEGIS_RELEASE_REHEARSAL == 'true' &&
          vars.AEGIS_IOS_BRANCH_REHEARSAL == 'true' &&
          github.repository_id == vars.AEGIS_RELEASE_TEST_REPOSITORY_ID }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      platform: ios
      profile: alpha
      destination: artifacts
      operation: package
      version: '0.8.0'
      build: '1'
      format: auto
      store_options: '{}'
    secrets: inherit

  macos-release-rehearsal:
    needs: [contracts, ios-archive]
    if: >-
      ${{ github.repository != 'gcsagroup/aegis-browser' &&
          vars.AEGIS_RELEASE_ENABLED == 'true' && vars.AEGIS_RELEASE_REHEARSAL == 'true' &&
          vars.AEGIS_MACOS_BRANCH_REHEARSAL == 'true' &&
          github.repository_id == vars.AEGIS_RELEASE_TEST_REPOSITORY_ID }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      platform: macos
      profile: alpha
      destination: artifacts
      operation: package
      format: auto
      store_options: '{}'
    secrets: inherit
